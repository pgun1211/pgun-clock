<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>pgun-clock</title>
<style>

/* 폰트 */
@font-face {
    font-family: 'Mulmaru';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/Mulmaru.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
}

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #000000;
    color: #ffffff;
    font-family: 'Mulmaru', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

#container {
    width: 100%;
    height: 100%;
    display: flex;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-box-pack: center;
    -webkit-box-align: center;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    box-sizing: border-box;
}

#container:fullscreen, #container:-webkit-full-screen {
    width: 100%;
    height: 100%;
    background-color: #000000;
}

/* 번인 방지 이동 영역 */
.content-box {
    text-align: center;
    transition: transform 0.8s ease-in-out;
    -webkit-transition: -webkit-transform 0.8s ease-in-out;
    padding: 10px;
}

.clock {
    font-size: 3.8rem;
    color: #ffffff;
    font-weight: normal;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.info-row {
    display: flex;
    display: -webkit-box;
    -webkit-box-pack: center;
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin-bottom: 15px;
}

.card {
    background-color: #111111;
    border: 1px solid #222222;
    border-radius: 10px;
    padding: 15px 25px;
    min-width: 160px;
}

.card-title {
    font-size: 1.1rem;
    color: #888888;
    margin-bottom: 5px;
}

.card-value {
    font-size: 2.5rem;
}

.weather-val {
    color: #ff9900;
}

.rate-val {
    color: #00ffcc;
}

.status-info {
    font-size: 0.85rem;
    color: #555555;
    margin-bottom: 20px;
}

/* 버튼 스타일 */
.btn-group {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    font-family: 'Mulmaru', sans-serif;
    background-color: #222222;
    border: 1px solid #444444;
    color: #ffffff;
    padding: 10px 18px;
    font-size: 0.85rem;
    border-radius: 5px;
    outline: none;
    cursor: pointer;
}

button:active {
    background-color: #444444;
}

#unlock-button {
    display: none;
}
</style>
</head>

<body>

<div id="container">
    <div class="content-box" id="box">
        <!-- 1. 시계 -->
        <div class="clock" id="clock-display">00:00:00</div>
        
        <!-- 2. 대전 날씨 & 환율 -->
        <div class="info-row">
            <div class="card">
                <div class="card-title">대전광역시 기온</div>
                <div class="card-value weather-val" id="weather-temp">--.- °C</div>
            </div>
            <div class="card">
                <div class="card-title">원·달러 환율</div>
                <div class="card-value rate-val" id="exchange-rate">----.-- 원</div>
            </div>
        </div>

        <div class="status-info" id="update-time">데이터 수신 준비 중...</div>
        
        <!-- 3. 화면 제어 -->
        <div class="btn-group">
            <button id="lock-landscape-button">가로모드 고정 & 전체화면</button>
            <button id="unlock-button">고정 해제</button>
        </div>
    </div>
</div>

<script>
var _LOCK_BUTTON = document.querySelector("#lock-landscape-button"),
    _UNLOCK_BUTTON = document.querySelector("#unlock-button"),
    _CONTAINER = document.querySelector("#container");

// 디지털 시계
function updateClock() {
    var now = new Date();
    var h = now.getHours() < 10 ? '0' + now.getHours() : now.getHours();
    var m = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
    var s = now.getSeconds() < 10 ? '0' + now.getSeconds() : now.getSeconds();
    document.getElementById('clock-display').innerText = h + ':' + m + ':' + s;
}

// 기온
function fetchWeather() {
    var xhr = new XMLHttpRequest();
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=36.351&longitude=127.385&current_weather=true';
    xhr.open('GET', url, true);
    xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
            try {
                var response = JSON.parse(xhr.responseText);
                var temp = response.current_weather.temperature;
                document.getElementById('weather-temp').innerText = temp.toFixed(1) + ' °C';
            } catch(e) {
                document.getElementById('weather-temp').innerText = '오류';
            }
        }
    };
    xhr.send();
}

// 환율
function fetchRate() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://open.er-api.com/v6/latest/USD', true);
    xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
            try {
                var response = JSON.parse(xhr.responseText);
                var krwRate = response.rates.KRW;
                document.getElementById('exchange-rate').innerText = krwRate.toFixed(1) + ' 원';
                
                var now = new Date();
                var timeStr = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + 
                              (now.getHours() < 10 ? '0' + now.getHours() : now.getHours()) + ':' + 
                              (now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes());
                document.getElementById('update-time').innerText = '최근 갱신: ' + timeStr;
            } catch(e) {
                document.getElementById('update-time').innerText = '파싱 오류';
            }
        }
    };
    xhr.send();
}

// 번인 방지
function preventBurnIn() {
    var box = document.getElementById('box');
    var x = (Math.random() - 0.5) * 40;
    var y = (Math.random() - 0.5) * 40;
    box.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    box.style.webkitTransform = 'translate(' + x + 'px, ' + y + 'px)';
}

// 전체화면 제어
_LOCK_BUTTON.addEventListener('click', function() {
    if (_CONTAINER.requestFullscreen) {
        _CONTAINER.requestFullscreen();
    } else if (_CONTAINER.webkitRequestFullScreen) {
        _CONTAINER.webkitRequestFullScreen();
    }

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape-primary").then(function() {
            _LOCK_BUTTON.style.display = 'none';
            _UNLOCK_BUTTON.style.display = 'inline-block';
        }).catch(function() {
            _LOCK_BUTTON.style.display = 'none';
            _UNLOCK_BUTTON.style.display = 'inline-block';
        });
    } else {
        _LOCK_BUTTON.style.display = 'none';
        _UNLOCK_BUTTON.style.display = 'inline-block';
    }
});

_UNLOCK_BUTTON.addEventListener('click', function() {
    if (document.exitFullscreen) {
        document.exitFullscreen();
    } else if (document.webkitCancelFullScreen) {
        document.webkitCancelFullScreen();
    }

    if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
    }

    _LOCK_BUTTON.style.display = 'inline-block';
    _UNLOCK_BUTTON.style.display = 'none';
});

function onFullscreenChange() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        _LOCK_BUTTON.style.display = 'inline-block';
        _UNLOCK_BUTTON.style.display = 'none';
    }
}

document.addEventListener("fullscreenchange", onFullscreenChange);
document.addEventListener("webkitfullscreenchange", onFullscreenChange);

// 타이머
updateClock();
fetchWeather();
fetchRate();

setInterval(updateClock, 1000);
setInterval(fetchWeather, 600000);
setInterval(fetchRate, 60000);
setInterval(preventBurnIn, 120000);
</script>

</body>
</html>
